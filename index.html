<!doctype html>
<html lang="ru">
<head>
<title>Саджесты Таи</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<style>
/* Layout: один экран телефона 375×812 (чат Таи) по компонентам Figma; без параметров — список ссылок на варианты. */
:root {
  color-scheme: light;
  --bg: #ffffff;
  --text: #333333;
  --text-secondary: #9299a2;
  --accent: #428bf9;
  --link: #0064fa;
  --chip: rgba(47, 172, 254, .1);
  --chip-pressed: rgba(47, 172, 254, .24);
  --info-pale: rgba(66, 139, 249, .16);
  --neutral-1: rgba(0, 16, 36, .03);
  --border: rgba(0, 16, 36, .12);
  --page: #eef1f5;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Roboto, "Segoe UI", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Roboto, "Segoe UI", Arial, sans-serif;
}
html { box-sizing: border-box; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
html, body { height: 100%; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body { margin: 0; font-size: 14px;background: var(--page); color: var(--text); font-family: var(--font); }
* { box-sizing: border-box; }
button, textarea, input { font: inherit; color: inherit; }

/* ---------- Прототип ---------- */
#app { height: 100%; }
.stage { height: 100%; display: flex; justify-content: center; align-items: center; overflow: hidden; }
.phone {
  position: relative; width: 100%; height: 100%;
  background: var(--bg); overflow: hidden; display: flex; flex-direction: column;
  cursor: default; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
.status, .home { display: none; }
/* Страница «Недавние чаты» */
.page { position: absolute; left: 0; right: 0; bottom: 0; top: 0; z-index: 7; background: var(--bg); display: flex; flex-direction: column; }
.page .nav-title { font-weight: 600; }
.cells { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 4px; }
.cells button.tap { flex: none; height: 64px; padding: 8px 16px; border-radius: 20px; display: flex; flex-direction: column; justify-content: center; gap: 4px; text-align: left; }
.cells button.tap.current { background: var(--neutral-1); }
.cell-title { height: 20px; overflow: hidden; white-space: nowrap; font-weight: 600; font-size: 15px; line-height: 20px; letter-spacing: -.24px; color: var(--text); -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); mask-image: linear-gradient(90deg, #000 85%, transparent); }
.cell-desc { font-size: 13px; line-height: 16px; letter-spacing: -.08px; color: var(--text-secondary); }
/* На экране шире телефона показываем корпус айфона: статус-бар, индикатор «домой», рамка */
@media (min-width: 500px) {
  .phone { flex: none; width: 375px; height: 812px; max-height: none; border-radius: 46px; box-shadow: 0 0 0 2px #2b2d31, 0 0 0 11px #0c0d0f, 0 0 0 12px #3a3d42, 0 24px 60px rgba(0, 16, 36, .28); }
  .status { flex: none; height: 44px; padding: 0 22px 0 34px; display: flex; align-items: center; justify-content: space-between; font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: -.2px; }
  .status-icons { display: flex; align-items: center; gap: 5px; }
  .page { top: 44px; border-radius: 0 0 46px 46px; }
  .home { display: block; position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #111; z-index: 8; pointer-events: none; }
}

.nav { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 16px 10px; background: var(--bg); }
.nav-left { display: flex; align-items: center; gap: 16px; height: 44px; }
.glass-btn { height: 44px; min-width: 44px; padding: 0 10px; border-radius: 296px; background: #fff; box-shadow: 0 2px 20px rgba(0, 0, 0, .12); display: flex; align-items: center; justify-content: center; gap: 24px; }
.nav-title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 17px; letter-spacing: -.41px; }
.avatar { flex: none; display: block; width: 36px; height: 36px; border-radius: 50%; }

.feed { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px 142px; display: flex; flex-direction: column; align-items: flex-start; }
.user-row { align-self: stretch; display: flex; justify-content: flex-end; padding-left: 32px; }
.turn { align-self: stretch; flex: none; display: flex; flex-direction: column; align-items: flex-start; }
.turn + .turn { margin-top: 24px; }
.bubble { background: var(--chip); border-radius: 14px; padding: 8px 10px; min-height: 36px; font-size: 16px; line-height: 1.2; word-break: break-word; }
.answer { align-self: stretch; display: flex; flex-direction: column; }
.h2 { padding-top: 20px; font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.2; }
.h3 { padding-top: 16px; font-weight: 700; font-size: 17px; line-height: 1.2; letter-spacing: -.41px; }
.p { padding-top: 12px; font-size: 17px; line-height: 1.2; letter-spacing: -.41px; }
.li { padding: 8px 0 0 6px; display: flex; gap: 12px; font-size: 17px; line-height: 1.2; letter-spacing: -.41px; }
.h1 { padding-top: 20px; font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.15; letter-spacing: .36px; }
.h2 + .li, .h3 + .li, .h2 + .ol { padding-top: 12px; }
.ol { padding-top: 8px; display: flex; gap: 8px; font-size: 17px; line-height: 1.2; letter-spacing: -.41px; }
.ol i { flex: none; font-style: normal; }
.p a { color: var(--link); text-decoration: none; }
.li::before { content: ""; flex: none; width: 6px; height: 6px; margin-top: 7px; border-radius: 50%; background: rgba(0, 16, 36, .22); }
.li b, .p b { font-weight: 700; }
.math { margin-top: 16px; background: var(--info-pale); border-radius: 12px; padding: 12px 16px; text-align: center; font-style: italic; font-size: 17px; line-height: 1.2; letter-spacing: -.41px; }
.actions { padding-top: 12px; display: flex; justify-content: space-between; align-items: center; }
.actions-left { display: flex; gap: 2px; }
.icon-btn { min-height: 30px; padding: 3px 7px; display: flex; align-items: center; justify-content: center; }
.footer { padding-top: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; line-height: 1.2; letter-spacing: -.08px; color: var(--text-secondary); }
.footer a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
button.tap { appearance: none; border: 0; margin: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button.tap:active { opacity: .45; }
button.tap:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 8px; }
.nav-tap { padding: 0; display: flex; }
.icon-btn.on svg path { stroke: var(--accent); }
button.skill { background: var(--neutral-1); }
button.skill { display: flex; align-items: center; gap: 4px; }
button.skill.on { color: var(--accent); padding-right: 7px; }
.ctx-wrap { position: absolute; inset: 0; z-index: 20; }
.ctx { position: absolute; bottom: 72px; width: 250px; padding: 6px 0; border-radius: 28px; background: rgba(247, 247, 247, .94); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); box-shadow: 0 8px 40px rgba(0, 0, 0, .16), 0 0 0 .5px rgba(0, 16, 36, .06); display: flex; flex-direction: column; }
.ctx button.tap { height: 44px; padding: 0 24px; text-align: left; font-size: 17px; letter-spacing: -.41px; color: #111; }
.sheet-wrap { position: absolute; inset: 0; z-index: 20; background: rgba(0, 16, 36, .4); display: flex; align-items: flex-end; }
.sheet-wrap.ctx-wrap { background: none; display: block; }
.sheet { width: 100%; background: var(--bg); border-radius: 24px 24px 0 0; padding: 8px 16px 34px; display: flex; flex-direction: column; }
.sheet::before { content: ""; align-self: center; width: 36px; height: 4px; margin-bottom: 12px; border-radius: 2px; background: var(--border); }
.sheet-title { padding: 4px 0 8px; font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.2; }
.sheet button.tap { padding: 14px 0; text-align: left; font-size: 17px; line-height: 1.2; letter-spacing: -.41px; color: var(--text); border-bottom: 1px solid var(--border); }
.sheet button.tap:last-child { border-bottom: 0; }
.toast { position: absolute; left: 50%; top: 64px; transform: translateX(-50%); z-index: 21; max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 100px; background: rgba(51, 51, 51, .94); color: #fff; font-size: 15px; line-height: 1.2; letter-spacing: -.24px; white-space: nowrap; pointer-events: none; }

.suggests { padding-top: 20px; display: flex; flex-wrap: wrap; gap: 8px; align-self: stretch; }
.chip {
  appearance: none; border: 0; margin: 0; max-width: 100%; text-decoration: none;
  display: flex; align-items: center; padding: 0 7px; border-radius: 30px; background: var(--chip);
  color: var(--link); font-weight: 600; font-size: 13px; line-height: 16px; letter-spacing: -.08px; white-space: nowrap;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.chip:active { background: var(--chip-pressed); }
.chip svg { flex: none; margin: 7px 0; }
.chip span { padding: 7px 4px; overflow: hidden; }
.static .chip:active { background: var(--chip); }

.thinking { padding-top: 20px; display: flex; align-items: center; gap: 8px; font-size: 17px; line-height: 1.2; letter-spacing: -.41px; }
.thinking img { flex: none; width: 24px; height: 24px; }
.thinking span { color: var(--text-secondary); background: linear-gradient(90deg, var(--text-secondary) 0%, var(--text-secondary) 35%, #d7dbe0 50%, var(--text-secondary) 65%, var(--text-secondary) 100%) 0 0 / 200% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@media (prefers-reduced-motion: reduce) { .thinking span { animation: none; } }

.edge { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; pointer-events: none; background: linear-gradient(to bottom, rgba(255, 255, 255, 0), #fff 62%); }
.composer {
  position: absolute; left: 16px; right: 16px; bottom: 30px; padding: 8px; border-radius: 24px;
  background: rgba(255, 255, 255, .86); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  box-shadow: 0 6px 17px rgba(0, 0, 0, .12), 0 0 0 .5px rgba(0, 16, 36, .06);
  display: flex; flex-direction: column; gap: 4px;
}
.composer textarea {
  display: block; width: 100%; height: 30px; max-height: 110px; padding: 5px 8px; margin: 0; border: 0; outline: 0; resize: none; background: transparent;
  font-size: 17px; line-height: 20px; letter-spacing: -.41px; color: var(--text); caret-color: var(--accent);
  user-select: text; -webkit-user-select: text; cursor: text;
}
.composer textarea::placeholder { color: var(--text-secondary); opacity: 1; }
.static .composer textarea { cursor: default; }
.composer-row { display: flex; align-items: center; justify-content: space-between; height: 30px; }
.composer-left { display: flex; align-items: center; gap: 4px; }
.skill { padding: 7px 11px; border-radius: 30px; background: var(--neutral-1); font-weight: 600; font-size: 13px; line-height: 16px; letter-spacing: -.08px; }
.send { appearance: none; border: 0; padding: 0; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.send:active { background: #2f76e6; }
.send:focus-visible, .chip:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

/* Стартовый экран: пустой чат */
.zero { margin: auto; align-self: center; padding: 32px 20px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
.zero .avatar { width: 80px; height: 80px; }
.zero-title { max-width: 290px; font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.2; letter-spacing: .38px; }

/* highlight: затемнение всего, кроме одного саджеста; нажатия отключены */
.shield { position: absolute; inset: 0; z-index: 9; overflow: hidden; }
.spot { position: absolute; border-radius: 30px; box-shadow: 0 0 0 3px #fff, 0 0 0 2000px rgba(0, 16, 36, .62); }

/* ---------- Список вариантов ---------- */
.index { max-width: 860px; margin: 0 auto; padding-block: 32px 48px; padding-inline: 16px; }
.index h1 { margin: 0 0 8px; font-family: var(--font-display); font-size: 28px; line-height: 1.15; text-wrap: balance; }
.index .lead { margin: 0 0 24px; max-width: 62ch; font-size: 15px; line-height: 1.45; color: #5b6470; }
.index h2 { margin: 28px 0 4px; font-size: 17px; }
.index .hint { margin: 0 0 12px; font-size: 13px; line-height: 1.4; color: #5b6470; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.row { background: #fff; border-radius: 12px; padding: 12px; display: grid; grid-template-columns: 190px minmax(0, 1fr) auto auto; gap: 8px 12px; align-items: center; }
.row .name { font-size: 14px; font-weight: 600; line-height: 1.3; }
.row .name small { display: block; font-weight: 400; color: #5b6470; }
.row input { min-width: 0; width: 100%; height: 36px; padding: 0 10px; border: 1px solid var(--border); border-radius: 8px; background: #f7f8fa; font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.row button, .row a { height: 36px; padding: 0 12px; border-radius: 8px; border: 0; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; text-decoration: none; white-space: nowrap; }
.row button { background: var(--accent); color: #fff; min-width: 108px; justify-content: center; }
.row a { background: var(--chip); color: var(--link); }
.row button:focus-visible, .row a:focus-visible, .row input:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
@media (max-width: 640px) { .row { grid-template-columns: minmax(0, 1fr) auto; } .row .name, .row input { grid-column: 1 / -1; } .row a { justify-self: start; } }
</style>
</head>
<body>

<div id="app"></div>

<script>
(function () {
  // Адрес опубликованного артефакта. Если задан — ссылки строятся с #-токеном (query-параметры до артефакта не доходят).
  var ARTIFACT_URL = '';

  var ICON = {

    battery: '<svg width="26" height="12" viewBox="0 0 26 12" fill="none" aria-hidden="true"><rect x=".500" y=".500" width="22" height="11" rx="3.200" stroke="#111" opacity=".4"/><rect x="2" y="2" width="19" height="8" rx="2" fill="#111"/><path d="M24 4v4c.900-.300 1.500-1.100 1.500-2S24.900 4.300 24 4Z" fill="#111" opacity=".45"/></svg>',
    cross: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" stroke="#428bf9" stroke-width="1.800" stroke-linecap="round"/></svg>',
    taya: '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M7 4c.5 4 1.500 5.500 5 7-3.500 1.500-4.500 3-5 7-.5-4-1.500-5.500-5-7 3.500-1.500 4.500-3 5-7Z" fill="#fff"/><path d="M15 4c.5 4 1.500 5.500 5 7-3.500 1.500-4.500 3-5 7-.5-4-1.500-5.500-5-7 3.500-1.500 4.500-3 5-7Z" fill="#fff"/></svg>'
  };

  var TEXTS = {
    product: {
      plain: [{ id: 'price', label: 'Сколько стоит Pro?' }, { id: 'compare', label: 'Чем Pro отличается от Black?' }],
      arrow: [{ id: 'pro', label: 'Подключить Pro' }, { id: 'tariffs', label: 'Все тарифы' }]
    },
    neutral: {
      plain: [{ id: 'price', label: 'Цена Pro' }, { id: 'compare', label: 'Pro и Black' }],
      arrow: [{ id: 'pro', label: 'Тариф Pro' }, { id: 'tariffs', label: 'Тарифы' }]
    }
  };
  var REPLIES = {
    price: 'Подписка Pro стоит 399\u00a0₽ в месяц. Деньги списываются раз в месяц, отключить подписку можно в любой момент.',

    other: 'Пока я могу рассказать только про подписку Pro: сколько она стоит, что в неё входит и как её подключить.'
  };
  // Куда ведут саджесты со стрелкой (открываются в новой вкладке).
  var LINKS = { pro: 'https://www.tbank.ru/pro/', tariffs: 'https://www.tbank.ru/', rules: 'https://www.tbank.ru/' };
  var QUERY = 'Расскажи про подписку Pro: что входит и как подключить';

  function readParams() {
    var o = {};
    try { new URLSearchParams(location.search).forEach(function (v, k) { o[k] = v; }); } catch (e) {}
    location.hash.replace(/^#/, '').split('_').forEach(function (part) {
      var i = part.indexOf('.');
      if (i > 0) o[part.slice(0, i)] = part.slice(i + 1);
    });
    return o;
  }

        '<div class="feed" id="feed">' +
          (isStatic ? userHtml(QUERY) + mainHtml() :
            '<div class="zero"><img class="avatar" src="' + AVATAR + '" alt=""><div class="zero-title">Я — Тая, универсальный ИИ-ассистент. Чем могу помочь?</div></div>') +
        '</div>' +
        '<div class="edge"></div>' +
        '<div class="composer">' +
          '<textarea id="message" rows="1" placeholder="Отвечу на вопросы" aria-label="Сообщение"' + (isStatic ? ' readonly tabindex="-1"' : '') + '>' + (isStatic ? '' : QUERY) + '</textarea>' +
          '<div class="composer-row"><div class="composer-left">' + tap('icon-btn', 'attach', 'Прикрепить', ICON.plus) + tap('skill', 'skills', '', 'Навыки') + '</div>' +
            '<button class="send" id="send" type="button" aria-label="Отправить"' + (isStatic ? ' hidden' : '') + '>' + ICON.send + '</button></div>' +
        '</div>' +
        '<div class="home"></div>' +
      '</div></div>';

    var phone = app.querySelector('.phone');
    var feed = document.getElementById('feed');
    var input = document.getElementById('message');
    var sendBtn = document.getElementById('send');

    // На широком экране корпус айфона показываем в 80% размера и уменьшаем дальше, если окно ниже.
    var fit = function () {
      var k = window.matchMedia('(min-width: 500px)').matches ? Math.min(.8, (window.innerHeight - 28) / 812) : 1;
      phone.style.transform = k < 1 ? 'scale(' + k + ')' : '';
    };
    fit();
    window.addEventListener('resize', fit);

    var started = isStatic;
    if (isStatic) { addSuggests(); toBottom(); } else resize();

    if (highlight) {
      var shield = document.createElement('div');
      shield.className = 'shield';
      shield.innerHTML = '<div class="spot"></div>';
      phone.appendChild(shield);
      var place = function () {
        toBottom();
        var chip = feed.querySelector('.chip[data-kind="' + highlight + '"]');
        var a = chip.getBoundingClientRect(), b = phone.getBoundingClientRect(), s = shield.firstChild.style, k = b.width / phone.offsetWidth;
        s.left = (a.left - b.left) / k + 'px'; s.top = (a.top - b.top) / k + 'px'; s.width = a.width / k + 'px'; s.height = a.height / k + 'px';
      };
      place();
      window.addEventListener('resize', place);
    }
    if (isStatic) return;

    // Остальные элементы интерфейса: шапка, строка действий, «+» и «Навыки».
    phone.addEventListener('click', function (e) {
      var item = e.target.closest('.sheet-wrap [data-pick]'), wrap = e.target.closest('.sheet-wrap'), el = e.target.closest('[data-act]');
      if (item) { var pick = sheetPick; closeSheet(); pick(item.dataset.pick); return; }
      if (wrap) { if (e.target === wrap) closeSheet(); return; }
      if (!el) return;
      var act = el.dataset.act;
      if (act === 'new') startPrototype(p);
      else if (act === 'menu') openHistory();
      else if (act === 'history-back') phone.querySelector('.page').remove();
      else if (act === 'history-current') phone.querySelector('.page').remove();
      else if (act === 'history-other') toast('В прототипе открыт только текущий чат');
      else if (act === 'copy') toast('Скопировано');
      else if (act === 'like' || act === 'dislike') {
        var on = !el.classList.contains('on');
        [].forEach.call(el.parentNode.querySelectorAll('.on'), function (b) { b.classList.remove('on'); });
        el.classList.toggle('on', on);
      }
      else if (act === 'more') sheet('', ['Скопировать ответ', 'Поделиться', 'Сообщить об ошибке'], function (v) { toast(v === 'Скопировать ответ' ? 'Скопировано' : v === 'Поделиться' ? 'Ссылка скопирована' : 'Спасибо, передали команде'); });
      else if (act === 'attach') menu(24, ['Выбрать фото из галереи', 'Сделать фото'], function () { toast('В прототипе вложения недоступны'); });
      else if (act === 'skills') {
        if (el.classList.contains('on')) { el.classList.remove('on'); el.textContent = 'Навыки'; }
        else menu(58, ['Найти товары', 'Инвестиции'], function (v) { el.classList.add('on'); el.innerHTML = esc(v) + ICON.cross; });
      }
    });
    // Системное контекстное меню над композером (как в iOS).
    function menu(left, items, onPick) {
      closeSheet();
      sheetPick = onPick;
      phone.insertAdjacentHTML('beforeend', '<div class="sheet-wrap ctx-wrap"><div class="ctx" style="left:' + left + 'px">' +
        items.map(function (t) { return '<button class="tap" type="button" data-pick="' + esc(t) + '">' + esc(t) + '</button>'; }).join('') + '</div></div>');
    }
    function openHistory() {
      var chats = [['Сколько стоит завести хамелеона', 'Сегодня · 17:41'], ['Метеозависимость правда или миф, что говорит наука', 'Сегодня · 9:41'], ['Доказательство теоремы Ферма', 'Вчера · 11:23'],
        ['Принцип помодоро как применять', '25 мая'], ['Краткий пересказ Властелина колец', '25 мая'], ['Напиши поздравление коллеге с днем рождения', '16 мая'], ['Расскажи что за принципы эко редьюс', '4 мая']];
      var cell = function (act, title, desc, cls) { return '<button class="tap' + (cls || '') + '" type="button" data-act="' + act + '"><span class="cell-title">' + esc(title) + '</span><span class="cell-desc">' + desc + '</span></button>'; };
      phone.insertAdjacentHTML('beforeend', '<div class="page"><div class="nav"><div class="nav-left">' +
        '<button class="tap glass-btn" type="button" data-act="history-back" aria-label="Назад">' + ICON.back + '</button><div class="nav-title">Недавние чаты</div></div>' +
        '<div class="glass-btn">' + tap('nav-tap', 'new', 'Новый чат', ICON.chat) + '</div></div><div class="cells">' +
        (started ? cell('history-current', QUERY, 'Сейчас', ' current') : '') +
        chats.map(function (c) { return cell('history-other', c[0], c[1]); }).join('') + '</div></div>');
    }
    var sheetPick = null;
    function sheet(title, items, onPick) {
      closeSheet();
      sheetPick = onPick;
      phone.insertAdjacentHTML('beforeend', '<div class="sheet-wrap"><div class="sheet">' + (title ? '<div class="sheet-title">' + title + '</div>' : '') +
        items.map(function (t) { return '<button class="tap" type="button" data-pick="' + esc(t) + '">' + esc(t) + '</button>'; }).join('') + '</div></div>');
    }
    function closeSheet() { var w = phone.querySelector('.sheet-wrap'); if (w) w.remove(); sheetPick = null; }
    function toast(text) {
      var old = phone.querySelector('.toast'); if (old) old.remove();
      phone.insertAdjacentHTML('beforeend', '<div class="toast">' + esc(text) + '</div>');
      var t = phone.lastElementChild;
      setTimeout(function () { t.remove(); }, 1600);
    }

    feed.addEventListener('click', function (e) {
      var chip = e.target.closest('.chip');
      if (!chip) return;
      if (busy) { e.preventDefault(); return; }
      if (chip.dataset.kind === 'arrow') return;
      e.preventDefault();
      sendMessage(chip.textContent, chip.dataset.id);
    });
    input.addEventListener('input', function () { resize(); sendBtn.hidden = !input.value.trim(); });
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });
    sendBtn.addEventListener('click', submit);

    function submit() {
      var text = input.value.trim();
      if (!text || busy) return;
      input.value = ''; resize(); sendBtn.hidden = true;
      sendMessage(text, started ? 'other' : 'main');
    }
    function sendMessage(text, id) {
      busy = true;
      if (!started) { started = true; feed.querySelector('.zero').remove(); phone.querySelector('[data-act="new"]').hidden = false; }
      var old = feed.querySelector('.suggests');
      if (old) old.remove();
      var main = id === 'main';
      // Новый запрос встаёт к верху экрана и остаётся там: пока ответ формируется, лента не прокручивается сама.
      var prev = feed.querySelector('.turn:last-child');
      if (prev) prev.style.minHeight = '';
      var turn = document.createElement('div');
      turn.className = 'turn';
      turn.innerHTML = userHtml(text) + '<div class="thinking"><img src="' + LOADER + '" width="24" height="24" alt=""><span>Читаю запрос</span></div>';
      feed.appendChild(turn);
      turn.style.minHeight = Math.max(0, feed.clientHeight - 154) + 'px';
      feed.scrollTop = turn.offsetTop - feed.offsetTop - 12;
      var thinking = turn.querySelector('.thinking'), label = thinking.querySelector('span');
      setTimeout(function () { label.textContent = main ? 'Ищу информацию о подписке Pro' : 'Готовлю ответ'; }, main ? 900 : 600);
      setTimeout(function () {
        thinking.remove();
        turn.insertAdjacentHTML('beforeend', main ? mainHtml() : '<div class="answer"><div class="p">' + REPLIES[id] + '</div>' + actionsHtml() + '</div>');
        stream(turn.lastElementChild, function () { addSuggests(turn); busy = false; });
      }, main ? 2200 : 1300);
    }
    // Ответ «печатается» по словам; строка действий и футер появляются в конце.
    function stream(answer, done) {
      var tail = [].slice.call(answer.querySelectorAll('.actions, .footer'));
      var blocks = [].slice.call(answer.children).filter(function (el) { return tail.indexOf(el) < 0; });
      var queue = [];
      blocks.forEach(function (block) {
        var walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT), node;
        while ((node = walker.nextNode())) { queue.push({ block: block, node: node, words: node.nodeValue.match(/\S+\s*|\s+/g) || [] }); node.nodeValue = ''; }
        block.hidden = true;
      });
      tail.forEach(function (el) { el.hidden = true; });
      answer.classList.add('streaming');
      var timer = setInterval(function () {
        var item = queue[0];
        if (!item) {
          clearInterval(timer);
          answer.classList.remove('streaming');
          tail.forEach(function (el) { el.hidden = false; });
          done();
          return;
        }
        item.block.hidden = false;
        item.node.nodeValue += item.words.splice(0, 2).join('');
        if (!item.words.length) queue.shift();
      }, 45);
    }
    function userHtml(text) { return '<div class="user-row"><div class="bubble">' + esc(text) + '</div></div>'; }
    function mainHtml() {
      return '<div class="answer">' +
        '<div class="h2">Подписка Pro</div>' +
        '<div class="p">Pro — платная подписка к вашей карте. Она повышает кэшбэк и снимает часть комиссий.</div>' +
        '<div class="p">Подключить её можно в приложении: откройте профиль, выберите «Подписки» и нажмите «Подключить».</div>' +
        '<div class="h3">Что входит в Pro</div>' +
        '<div class="li"><span><b>Стоимость:</b> 399\u00a0₽ в месяц</span></div>' +
        '<div class="li"><span><b>Кэшбэк:</b> до 30% у партнёров</span></div>' +
        '<div class="li"><span>Переводы без комиссии до 200\u00a0000\u00a0₽ в месяц</span></div>' +
        '<div class="math">Выгода = кэшбэк за месяц − 399\u00a0₽</div>' +
        actionsHtml() +
        '<div class="footer"><div>Ответ сгенерирован ИИ и может содержать неточности. Проверяйте важную информацию.</div>' +
          '<div>Подробнее — в ' + (isStatic ? '<u>правилах сервиса</u>' : '<a href="' + LINKS.rules + '" target="_blank" rel="noopener">правилах сервиса</a>') + '</div></div>' +
      '</div>';
    }
    function tap(cls, act, label, inner, hide) {
      if (isStatic) return '<div class="' + cls + '">' + inner + '</div>';
      return '<button class="tap ' + cls + '" type="button" data-act="' + act + '"' + (label ? ' aria-label="' + label + '"' : '') + (hide ? ' hidden' : '') + '>' + inner + '</button>';
    }
    function resize() { input.style.height = '30px'; input.style.height = Math.min(input.scrollHeight, 110) + 'px'; }

    function actionsHtml() {
      return '<div class="actions"><div class="actions-left">' + tap('icon-btn', 'copy', 'Скопировать', ICON.copy) + tap('icon-btn', 'like', 'Нравится', ICON.up) + tap('icon-btn', 'dislike', 'Не нравится', ICON.down) + '</div>' + tap('icon-btn', 'more', 'Ещё', ICON.more) + '</div>';
    }
    function addSuggests(target) {
      var chip = function (kind) {
        return set[kind].map(function (s) {
          var inner = (kind === 'arrow' ? ICON.arrow : '') + '<span>' + s.label + '</span>';
          var attrs = ' class="chip" data-kind="' + kind + '" data-id="' + s.id + '"';
          if (kind === 'arrow' && !isStatic) return '<a' + attrs + ' href="' + LINKS[s.id] + '" target="_blank" rel="noopener">' + inner + '</a>';
          return '<button' + attrs + ' type="button"' + (isStatic ? ' tabindex="-1"' : '') + '>' + inner + '</button>';
        }).join('');
      };
      (target || feed).insertAdjacentHTML('beforeend', '<div class="suggests">' + (arrowFirst ? chip('arrow') + chip('plain') : chip('plain') + chip('arrow')) + '</div>');
    }
    function toBottom() { feed.scrollTop = feed.scrollHeight; }
  }
})();
</script>
</body>
</html>
